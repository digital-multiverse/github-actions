name: lint
description: Install dependencies and run Biome lint (Yarn Berry)
author: Digital Multiverse

inputs:
  node-version:
    description: "Node.js version"
    default: "24"
    required: false
  fix:
    description: "Apply fixes (lint:write) instead of only checking (lint:check)"
    default: "false"
    required: false

runs:
  using: composite
  steps:
    - name: Install
      uses: digital-multiverse/github-actions/yarn/install@v2
      with:
        node-version: ${{ inputs.node-version }}
    - name: Lint
      run: yarn run ${{ inputs.fix == 'true' && 'lint:write' || 'lint:check' }}
      shell: bash
