name: yarn install
description: Checkout, enable Corepack (Yarn Berry), set up Node with caching and run an immutable install
author: Digital Multiverse

inputs:
  node-version:
    description: "Node.js version (used only if node-version-file is empty)"
    default: "24"
    required: false
  node-version-file:
    description: "Path to a file with the Node.js version (e.g. .nvmrc). Overrides node-version."
    default: ""
    required: false

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Enable Corepack (Yarn Berry)
      run: corepack enable
      shell: bash
    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        cache: yarn
    - name: Install dependencies
      run: yarn install --immutable
      shell: bash
