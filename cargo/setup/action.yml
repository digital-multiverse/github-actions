name: cargo setup
description: Checkout, install the Rust toolchain (rustfmt + clippy) and set up cargo caching
author: Digital Multiverse

inputs:
  toolchain:
    description: "Rust toolchain"
    default: "stable"
    required: false
  workspaces:
    description: "Path(s) to the cargo workspace for caching"
    default: "."
    required: false

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: rustfmt, clippy
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.workspaces }}
